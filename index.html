  var _catMasterModel = null;
  var _catWaiters = [];
  var _catIsBuilding = false;

  function getOrCreateCatModel(callback) {
    if (_catMasterModel) {
      callback(_catMasterModel);
      return;
    }
    _catWaiters.push(callback);
    if (_catIsBuilding) return;
    _catIsBuilding = true;

    function buildFromStrings(mtlText, objText) {
      try {
        var mtlLoader = new THREE.MTLLoader();
        var materials = mtlLoader.parse(mtlText, '');
        materials.preload();

        // 조명 및 텍스처 양면 렌더링 보정 (우주 공간에서 어둡지 않고 선명하게)
        Object.keys(materials.materials).forEach(function(name) {
          var m = materials.materials[name];
          m.side = THREE.DoubleSide;
          // 광원 반응성 최적화
          if (m.shininess !== undefined) m.shininess = 25;
        });

        var objLoader = new THREE.OBJLoader();
        objLoader.setMaterials(materials);
        var group = objLoader.parse(objText);

        // 중심점(피벗)을 고양이 바운딩 박스 중심(0, 0, 0)으로 자동 정렬
        var box = new THREE.Box3().setFromObject(group);
        var center = box.getCenter(new THREE.Vector3());
        group.position.sub(center);

        var root = new THREE.Group();
        root.add(group);

        _catMasterModel = root;
        _catWaiters.forEach(function(cb) { cb(_catMasterModel); });
        _catWaiters = [];
        console.log('🐱 cat.obj 모델 로드 및 피벗 정렬 완료!');
      } catch (err) {
        console.error('고양이 OBJ 파싱 실패:', err);
      }
    }

    // http/https 서버 환경이면 최신 파일 직접 로드 시도, file: 이거나 오류 시 인라인 데이터 파싱
    if (window.location.protocol.indexOf('http') === 0) {
      Promise.all([
        fetch('cat.mtl').then(function(r) { return r.text(); }),
        fetch('cat.obj').then(function(r) { return r.text(); })
      ]).then(function(results) {
        buildFromStrings(results[0], results[1]);
      }).catch(function(err) {
        console.warn('로컬 파일 fetch 실패, 인라인 OBJ 데이터로 대체:', err);
        buildFromStrings(RAW_CAT_MTL, RAW_CAT_OBJ);
      });
    } else {
      buildFromStrings(RAW_CAT_MTL, RAW_CAT_OBJ);
    }
  }

  AFRAME.registerComponent('starfield', {
    init: function () {
      var g = document.createElement('a-entity');
      for (var i = 0; i < 750; i++) {
        var s   = document.createElement('a-sphere');
        var r   = 70;
        var phi = Math.random() * Math.PI * 2;
        var ct  = Math.random() * 2 - 1;
        var th  = Math.acos(ct);
        s.setAttribute('position',
          (r*Math.sin(th)*Math.cos(phi)) + ' ' +
          (r*Math.sin(th)*Math.sin(phi)) + ' ' +
          (r*Math.cos(th)));
        s.setAttribute('radius', 0.045 + Math.random() * 0.075);
        var c = Math.random() > 0.65 ? '#ffd8ef' : (Math.random() > 0.4 ? '#c8e2ff' : '#ffffff');
        s.setAttribute('color', c);
        s.setAttribute('material', 'shader:flat;emissive:' + c + ';emissiveIntensity:1;');
        g.appendChild(s);
      }
      this.el.appendChild(g);
    }
  });

      this.orbitAngle  = this.data.startAngle;
      this.floatPhase  = Math.random() * Math.PI * 2;
      this.tumblePhase = Math.random() * Math.PI * 2;
      this.driftPhase  = Math.random() * Math.PI * 2;

      var sc = this.el.getAttribute('scale');
      this.baseScale = sc ? (parseFloat(sc.x) || 1) : 1;

      // OBJ 고양이 메쉬 장착
      getOrCreateCatModel((mesh) => {
        this.el.setObject3D('mesh', mesh.clone(true));
      });
    },

    tick: function (time, delta) {
      var d = this.data;
      var o = this.el.object3D;
      var dt = Math.min(delta, 80) / 1000;
      var sec = time / 1000;

      /* 1. 내 주위 공전 궤도 각도 업데이트 */
      var orbitW = (2 * Math.PI) / (d.orbitDur / 1000);
      this.orbitAngle += (d.ccw ? orbitW : -orbitW) * dt;

      /* 2. 둥둥 떠다니는 상하(Y) 및 반경 미세 호흡 유영 */
      var bobY = Math.sin(sec * d.bobSpeed + this.floatPhase) * d.bobAmp;
      var currentR = d.radius + Math.cos(sec * (d.bobSpeed * 0.7) + this.driftPhase) * 0.15;

      /* 3. 궤도 좌표 계산 (기울기 tilt 적용) */
      var tR = THREE.MathUtils.degToRad(d.tilt);
      var ox = currentR * Math.cos(this.orbitAngle);
      var oz = currentR * Math.sin(this.orbitAngle);
      var oy = d.yOff + bobY - oz * Math.sin(tR);
      oz = oz * Math.cos(tR);

      o.position.set(ox, oy, oz);

      /* 4. 무중력 우주 비행 회전 (비행 진행 방향 + 3축 둥실거림) */
      var travelYaw = -this.orbitAngle + (d.ccw ? Math.PI / 2 : -Math.PI / 2);
      var p = Math.sin(sec * (d.bobSpeed * 0.85) + this.tumblePhase) * d.pitchAmp;
      var r = Math.cos(sec * (d.bobSpeed * 0.65) + this.floatPhase) * d.rollAmp;
      var y = travelYaw + Math.sin(sec * (d.bobSpeed * 0.45) + this.tumblePhase * 1.2) * 0.15;

      o.rotation.set(p, y, r, 'YXZ');
    }
  });

  // 호환용 별칭
  AFRAME.registerComponent('floating-cat', {
    schema: {
      radius:   { type: 'number',  default: 3.2 },
      orbitDur: { type: 'number',  default: 22000 },
      tilt:     { type: 'number',  default: 0 },
      yOff:     { type: 'number',  default: 0 },
      ccw:      { type: 'boolean', default: true }
    },
    init: function () {
      this.el.setAttribute('cat-obj-flyer', {
        radius:   this.data.radius,
        orbitDur: this.data.orbitDur,
        tilt:     this.data.tilt,
        yOff:     this.data.yOff,
        ccw:      this.data.ccw
      });
    }
  });
  </script>

  <style>
  *, html, body { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    background:#020617;
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  /* HUD */
  #hud {
    position:fixed; bottom:20px; left:20px;
    display:flex; align-items:center; gap:14px;
    background:rgba(2,6,23,.85); backdrop-filter:blur(14px);
    border:1px solid rgba(247,70,138,.45); border-radius:14px;
    padding:12px 18px; color:#fff; z-index:999;
    box-shadow:0 6px 30px rgba(0,0,0,.65);
  }
  #hud img {
    width:52px; height:52px; border-radius:10px;
    object-fit:cover; border:2px solid #F7468A;
    box-shadow:0 0 14px rgba(247,70,138,.65);
  }
  .ht { font-weight:800; font-size:15px; color:#fce7f3; margin-bottom:4px; display:flex; align-items:center; }
  .hd { font-size:12px; color:#94a3b8; line-height:1.6; }
  .bx {
    display:inline-block;
    background:linear-gradient(135deg,#f43f5e,#F7468A);
    color:#fff; font-size:10px; padding:2px 8px;
    border-radius:6px; margin-left:8px; vertical-align:middle;
  }

  /* 도움말 */
  #help {
    position:fixed; top:20px; right:20px;
    background:rgba(2,6,23,.82); backdrop-filter:blur(12px);
    border:1px solid rgba(247,70,138,.35); border-radius:12px;
    padding:12px 18px; color:#cbd5e1; font-size:13px; line-height:1.9;
    z-index:999;
    box-shadow:0 4px 20px rgba(0,0,0,.5);
  }
  #help strong { color:#f9a8d4; }
  </style>
</head>
<body>

<!-- HUD -->
<div id="hud">
  <img src="cat_photo.png" alt="고양이"/>
  <div>
    <div class="ht">🐱 우주를 둥둥 날아다니는 고양이<span class="bx">cat.obj 3D</span></div>
    <div class="hd">
      cat.obj & cat.mtl 고양이 모델 적용 완료<br>
      <strong style="color:#f9a8d4">우주 공간에서 둥둥 떠다니며 내 주위를 평화롭게 돌고 있어요 🌌✨</strong>
    </div>
  </div>
</div>

<!-- 도움말 -->
<div id="help">
  <strong>🖱 마우스 드래그</strong>: 시점 둘러보기<br>
  <strong>WASD</strong>: 우주 공간 이동<br>
  <span style="color:#94a3b8">고양이가 둥둥 날아다니며 주위를 돌고 있어요 🐾</span>
</div>

<!-- A-Frame Scene -->
<a-scene background="color:#020617">

  <a-assets>
    <a-asset-item id="cat-obj-file" src="cat.obj"></a-asset-item>
    <a-asset-item id="cat-mtl-file" src="cat.mtl"></a-asset-item>
  </a-assets>

  <!-- 별 배경 -->
  <a-entity starfield></a-entity>

  <!-- 조명 (cat.obj의 색감과 디테일이 선명하게 보이도록 화사한 우주 조명) -->
  <a-entity light="type:ambient;color:#ffffff;intensity:0.95"></a-entity>
  <a-entity light="type:directional;color:#ffffff;intensity:1.3" position="5 9 6"></a-entity>
  <a-entity light="type:directional;color:#d8e8ff;intensity:0.8" position="-5 -4 -5"></a-entity>
  <a-entity light="type:point;color:#F7468A;intensity:1.8;distance:90" position="0 6 6"></a-entity>
  <a-entity light="type:point;color:#70b8ff;intensity:1.0;distance:50" position="-6 2 4"></a-entity>
  <a-entity light="type:point;color:#c084fc;intensity:0.9;distance:60" position="6 -2 -4"></a-entity>

  <!-- 카메라 리그 (기본 눈높이 1.6m) -->
  <a-entity id="camera-rig" position="0 1.6 0">
    <a-camera position="0 0 0" look-controls wasd-controls>
    </a-camera>
  </a-entity>

  <!--
    ────────── 둥둥 날아다니는 고양이들 (플레이어 주위 공전) ──────────
  -->

  <!-- 고양이 1: 정면 시야 메인 고양이 (열자마자 바로 앞에서 날아다니는 모습이 보임!) -->
  <a-entity
    cat-obj-flyer="radius:3.2; orbitDur:22000; tilt:8; yOff:1.5; bobAmp:0.35; bobSpeed:1.5; ccw:true; startAngle:-1.570796327"
    scale="1.0 1.0 1.0">
  </a-entity>

  <!-- 고양이 2: 아기 고양이 (약간 높은 궤도, 기울기 18°, 역방향 날아다니기) -->
  <a-entity
    cat-obj-flyer="radius:4.5; orbitDur:28000; tilt:18; yOff:2.0; bobAmp:0.42; bobSpeed:1.2; ccw:false; startAngle:0.8"
    scale="0.75 0.75 0.75">
  </a-entity>

  <!-- 고양이 3: 대형 고양이 (조금 먼 궤도, 기울기 -14°, 여유롭게 유영) -->
  <a-entity
    cat-obj-flyer="radius:5.8; orbitDur:36000; tilt:-14; yOff:1.1; bobAmp:0.48; bobSpeed:1.0; ccw:true; startAngle:2.4"
    scale="1.4 1.4 1.4">
  </a-entity>

  <!-- 고양이 4: 높은 궤도 아기 고양이 (반경 7.2m, 기울기 26°, 큰 궤도 비행) -->
  <a-entity
    cat-obj-flyer="radius:7.2; orbitDur:46000; tilt:26; yOff:2.4; bobAmp:0.52; bobSpeed:0.85; ccw:false; startAngle:-3.0"
    scale="0.6 0.6 0.6">
  </a-entity>

</a-scene>

</body>
</html>
